# Builds the Windows installer so a stranger can download one file and
# double-click. No npm, no git, no PowerShell homework.
#
# A push to main publishes the next patch when that version tag already
# exists, then attaches the installer to the GitHub Release. A version tag
# or a manual run builds that exact version. The installed app picks the
# release up on its own and applies it when he is idle.

name: Windows installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish the next patch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git fetch origin --tags
          ver=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            npm version patch --no-git-tag-version
            ver=$(node -p "require('./package.json').version")
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add package.json package-lock.json
            git commit -m "chore: release $ver"
            git push origin HEAD:main
          fi
          git tag "v$ver" || true
          git push origin "v$ver"
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: scrappy-windows
          path: |
            release/Scrappy-Setup-*.exe
            release/Scrappy-Setup-*.exe.blockmap
            release/latest.yml

      - name: Stable download name
        shell: bash
        run: |
          src=$(ls release/Scrappy-Setup-*.exe | grep -v blockmap | head -n 1)
          cp "$src" release/Scrappy-Setup.exe

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}
          files: |
            release/Scrappy-Setup.exe
            release/Scrappy-Setup-*.exe
            release/Scrappy-Setup-*.exe.blockmap
            release/latest.yml
          generate_release_notes: true
