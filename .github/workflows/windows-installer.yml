# Builds the Windows installer so a stranger can download one file and
# double-click. No npm, no git, no PowerShell homework.
#
# Trigger: a version tag (v1.0.1) or a manual run from the Actions tab.
# The .exe lands on the GitHub Release for that tag.

name: Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: scrappy-windows
          path: |
            release/Scrappy-Setup-*.exe
            release/latest.yml
