<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Workbuddy</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage">
      <div id="cog" class="cog" data-state="idle" data-facing="right">
        <div class="cog-flip"></div>
        <div class="bubble" id="bubble"></div>
        <div class="say-box" id="sayBox">
          <input id="sayInput" type="text" autocomplete="off" spellcheck="false" placeholder="say something…" maxlength="500" />
        </div>
      </div>
    </div>
    <script src="cog.js"></script>
    <script src="lines.js"></script>
    <script src="voice.js"></script>
    <script src="buddy.js"></script>
  </body>
</html>
